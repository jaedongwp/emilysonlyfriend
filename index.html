<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="bridge.js" data-leave-for-play-on-load data-tap-anywhere data-test-panel></script>
<title>Emily's Only Friend</title>
<meta name="description" content="A horror game for Android. Now open for pre-registration on Google Play.">
<meta property="og:title" content="Emily's Only Friend">
<meta property="og:description" content="Now open for pre-registration on Google Play.">
<meta property="og:image" content="https://jaedongwp.github.io/emilysonlyfriend/window.jpg">
<meta name="theme-color" content="#0b1230">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="card.css">
</head>
<body>
<main>
  <div class="art" role="img" aria-label="A girl in a red coat looks up at a lit window of a dark building"></div>
  <h1>Emily's<br>Only Friend</h1>
  <p class="open">Now open for pre-registration</p>
  <section class="card">
    <div class="glow"><img src="gift.jpg" alt="A gift wrapped in dark blue star paper, its lid lifted, warm light glowing inside"></div>
    <p class="headline">A gift is waiting<br><span>for you inside.</span></p>
    <p class="what">Pre-register now and it's yours the day the game comes out.</p>
    <a class="badge" id="play" data-play href="https://play.google.com/store/apps/details?id=com.onepunchapp.girlpuzzle">
      <img src="badge-preregister.png" alt="Pre-register on Google Play">
    </a>
    <p class="android-only" id="android-only">For Android</p>
    <p class="leaving" id="leaving">Opening Google Play…</p>
  </section>
  <p class="escape" id="escape">Not opening? <a id="chrome" href="#">Open in Chrome</a></p>
</main>
</body>
</html>
