<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emily's Only Friend</title>
<meta name="description" content="A horror game for Android. Now open for pre-registration on Google Play.">
<meta property="og:title" content="Emily's Only Friend">
<meta property="og:description" content="Now open for pre-registration on Google Play.">
<meta property="og:image" content="https://jaedongwp.github.io/emilysonlyfriend/window.jpg">
<meta name="theme-color" content="#0b1230">
<link rel="icon" href="../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0b1230;
    --navy-deep: #050817;
    --cream: #f3e6c8;
    --text: #e9ecf5;
    --muted: #9aa3bf;
    --amber: #f2a53f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: radial-gradient(120% 80% at 50% 30%, #16204a 0%, var(--navy) 45%, var(--navy-deep) 100%);
    background-color: var(--navy-deep);
    color: var(--text);
    font-family: Montserrat, system-ui, sans-serif;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 480px;
    padding: 0 0 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .art {
    width: 100%;
    aspect-ratio: 1024 / 500;
    background: url("../window.jpg") center / cover no-repeat;
    -webkit-mask-image: linear-gradient(to bottom, #000 62%, transparent 100%);
    mask-image: linear-gradient(to bottom, #000 62%, transparent 100%);
  }
  h1 {
    margin: 4px 16px 0;
    font-family: Kalam, cursive;
    font-weight: 700;
    font-size: clamp(42px, 13vw, 58px);
    line-height: 1.02;
    color: var(--cream);
  }
  .open {
    margin: 18px 16px 0;
    font-size: 17px;
    font-weight: 500;
  }
  .gift {
    position: relative;
    margin: 22px 16px 0;
    width: calc(100% - 32px);
    padding: 6px 20px 24px;
    border-radius: 24px;
    background: linear-gradient(180deg, rgba(242, 165, 63, 0.10) 0%, rgba(20, 28, 66, 0.55) 55%, rgba(8, 12, 32, 0.6) 100%);
    border: 1px solid rgba(242, 165, 63, 0.28);
    box-shadow: 0 0 60px rgba(242, 165, 63, 0.10), inset 0 1px 0 rgba(255, 220, 160, 0.10);
  }
  .lantern {
    position: relative;
    width: 168px;
    height: 168px;
    margin: 0 auto;
  }
  .lantern::before {
    content: "";
    position: absolute;
    inset: -30px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 190, 90, 0.38) 0%, rgba(255, 160, 60, 0.12) 40%, transparent 68%);
    animation: flicker 4.2s ease-in-out infinite;
  }
  .lantern img {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    -webkit-mask-image: radial-gradient(circle, #000 52%, transparent 71%);
    mask-image: radial-gradient(circle, #000 52%, transparent 71%);
  }
  .reward {
    margin: 2px 0 0;
    font-size: 21px;
    font-weight: 600;
    line-height: 1.3;
  }
  .reward span { color: var(--amber); }
  .what {
    margin: 10px auto 0;
    max-width: 300px;
    font-size: 14px;
    line-height: 1.45;
    color: var(--muted);
  }
  .badge {
    position: relative;
    display: block;
    margin: 20px auto 0;
    width: min(260px, 72vw);
    -webkit-tap-highlight-color: transparent;
  }
  .badge::before {
    content: "";
    position: absolute;
    inset: -10px -14px;
    border-radius: 22px;
    background: radial-gradient(closest-side, rgba(242, 165, 63, 0.45), transparent);
    animation: breathe 2.8s ease-in-out infinite;
  }
  .badge img { position: relative; display: block; width: 100%; height: auto; }
  .badge:active img { transform: scale(0.97); }
  @keyframes flicker {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    20% { opacity: 1; transform: scale(1.03); }
    35% { opacity: 0.78; }
    55% { opacity: 0.95; transform: scale(1.01); }
    75% { opacity: 0.82; }
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.9; }
  }
  @media (max-height: 780px) {
    .art { aspect-ratio: 1024 / 420; }
    h1 { font-size: 40px; }
    .open { margin-top: 12px; font-size: 15px; }
    .gift { margin-top: 16px; padding-bottom: 18px; }
    .lantern { width: 128px; height: 128px; }
    .reward { font-size: 19px; }
    .what { font-size: 13px; margin-top: 6px; }
    .badge { margin-top: 14px; width: min(230px, 66vw); }
  }
  @media (prefers-reduced-motion: reduce) {
    .lantern::before, .badge::before { animation: none; }
  }
  .escape {
    display: none;
    margin: 30px 16px 0;
    font-size: 14px;
    color: var(--muted);
  }
  .escape a { color: var(--text); font-weight: 600; }
  .escape.loud { color: var(--text); font-size: 16px; }
  .android-only {
    display: none;
    margin: 14px 16px 0;
    font-size: 13px;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <div class="art" role="img" aria-label="A girl in a red coat looks up at a lit window of a dark building"></div>
  <h1>Emily's<br>Only Friend</h1>
  <p class="open">Now open for pre-registration</p>
  <section class="gift">
    <div class="lantern"><img src="../lantern.jpg" alt="Emily's tin lantern, a black tin lantern with a big star cut out, glowing"></div>
    <p class="reward">Pre-register and get<br><span>her tin lantern.</span></p>
    <p class="what">A black tin lantern punched with tiny holes and a big star for the light to shine through.</p>
    <a class="badge" id="play" href="https://play.google.com/store/apps/details?id=com.onepunchapp.girlpuzzle">
      <img src="../badge-preregister.png" alt="Pre-register on Google Play">
    </a>
    <p class="android-only" id="android-only">For Android</p>
  </section>
  <p class="escape" id="escape">Not opening? <a id="chrome" href="#">Open in Chrome</a></p>
</main>
<script>
  const packageName = "com.onepunchapp.girlpuzzle";
  const page = new URLSearchParams(location.search);
  const sourceOf = (tag) => tag === "ig" ? "instagram" : tag;
  const source = page.get("s") || sourceOf(page.get("utm_source")) || "instagram";
  const referrer = encodeURIComponent("utm_source=" + source + "&utm_campaign=prereg");
  const storeAddress = "https://play.google.com/store/apps/details?id=" + packageName + "&referrer=" + referrer;
  const playAppIntent = "intent://details?id=" + packageName + "&referrer=" + referrer +
    "#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=" + encodeURIComponent(storeAddress) + ";end";
  const chromeIntent = "intent://" + location.host + location.pathname + "?s=" + encodeURIComponent(source) +
    "#Intent;scheme=https;package=com.android.chrome;end";

  const agent = navigator.userAgent;
  const isAndroid = /Android/i.test(agent);
  const isInAppBrowser = /Instagram|FBAN|FBAV|FB_IAB|TikTok|musical_ly|BytedanceWebview|; wv\)/i.test(agent);

  const play = document.getElementById("play");
  const escape = document.getElementById("escape");
  play.href = isAndroid && isInAppBrowser ? playAppIntent : storeAddress;
  document.getElementById("chrome").href = chromeIntent;
  if (!isAndroid) document.getElementById("android-only").style.display = "block";
  if (isAndroid && isInAppBrowser) escape.style.display = "block";

  play.addEventListener("click", () => {
    let left = false;
    const markLeft = () => { if (document.hidden) left = true; };
    document.addEventListener("visibilitychange", markLeft);
    setTimeout(() => {
      document.removeEventListener("visibilitychange", markLeft);
      if (!left && isAndroid) {
        escape.style.display = "block";
        escape.classList.add("loud");
      }
    }, 1800);
  });
</script>
</body>
</html>
