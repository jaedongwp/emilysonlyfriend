<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emily's Only Friend</title>
<meta name="description" content="A horror game for Android. Now open for pre-registration on Google Play.">
<meta property="og:title" content="Emily's Only Friend">
<meta property="og:description" content="Now open for pre-registration on Google Play.">
<meta property="og:image" content="https://jaedongwp.github.io/emilysonlyfriend/window.jpg">
<meta name="theme-color" content="#0b1230">
<link rel="icon" href="../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../base.css">
<style>
  .hero {
    position: relative;
    width: 100%;
    height: 58vh;
    height: 58dvh;
    min-height: 340px;
    background: url("../hero.jpg") 50% 36% / cover no-repeat;
  }
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 55%, rgba(11, 18, 48, 0.55) 78%, var(--navy) 100%);
  }
  .hero h1 {
    position: absolute;
    z-index: 1;
    left: 0;
    right: 0;
    bottom: 2vh;
    margin: 0 16px;
    font-size: clamp(44px, 14vw, 62px);
    text-shadow: 0 2px 18px rgba(5, 8, 23, 0.8);
  }
  .open {
    margin: 14px 16px 0;
    font-size: 17px;
    font-weight: 500;
  }
  .badge { margin-top: 18px; }
  .strip {
    display: flex;
    align-items: center;
    gap: 14px;
    width: calc(100% - 32px);
    margin: auto 16px 0;
    padding: 10px 18px 10px 10px;
    border-radius: 20px;
    color: var(--text);
    text-align: left;
    text-decoration: none;
    background: linear-gradient(90deg, rgba(242, 165, 63, 0.16) 0%, rgba(20, 28, 66, 0.6) 60%, rgba(8, 12, 32, 0.6) 100%);
    border: 1px solid rgba(242, 165, 63, 0.3);
    box-shadow: 0 0 40px rgba(242, 165, 63, 0.10), inset 0 1px 0 rgba(255, 220, 160, 0.10);
    -webkit-tap-highlight-color: transparent;
  }
  .strip .glow { flex: 0 0 76px; height: 76px; }
  .strip p {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    line-height: 1.3;
  }
  .strip span { color: var(--amber); }
  .end { flex: 0 0 auto; height: 24px; height: max(24px, env(safe-area-inset-bottom)); }
  .room { flex: 0 0 auto; height: 22px; }
  @media (max-height: 800px) {
    .hero { background-position: 50% 55%; }
  }
  @media (max-height: 700px) {
    .hero { height: 52dvh; min-height: 300px; background-position: 50% 68%; }
    .hero h1 { font-size: 44px; }
    .open { margin-top: 10px; font-size: 15px; }
    .badge { margin-top: 12px; width: min(230px, 66vw); }
    .strip .glow { flex-basis: 62px; height: 62px; }
    .strip p { font-size: 15px; }
    .room { height: 14px; }
    .end { height: 14px; }
  }
</style>
</head>
<body>
<main>
  <header class="hero" role="img" aria-label="A girl in a red coat stands under the one lit window of a dark building at night">
    <h1>Emily's<br>Only Friend</h1>
  </header>
  <p class="open">Now open for pre-registration</p>
  <a class="badge" id="play" data-play href="https://play.google.com/store/apps/details?id=com.onepunchapp.girlpuzzle">
    <img src="../badge-preregister.png" alt="Pre-register on Google Play">
  </a>
  <p class="android-only" id="android-only">For Android</p>
  <p class="escape" id="escape">Not opening? <a id="chrome" href="#">Open in Chrome</a></p>
  <div class="room"></div>
  <a class="strip" id="reward" data-play href="https://play.google.com/store/apps/details?id=com.onepunchapp.girlpuzzle">
    <span class="glow"><img src="../lantern-close.jpg" alt="Emily's tin lantern, a black tin lantern with a big star cut out, glowing"></span>
    <p>Pre-register and get<br><span>her tin lantern.</span></p>
  </a>
  <div class="end"></div>
</main>
<script src="../bridge.js"></script>
</body>
</html>
