<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emily's Only Friend</title>
<meta name="description" content="A horror game for Android. Now open for pre-registration on Google Play.">
<meta property="og:title" content="Emily's Only Friend">
<meta property="og:description" content="Now open for pre-registration on Google Play.">
<meta property="og:image" content="https://emilysonlyfriend.com/window.jpg">
<meta name="theme-color" content="#03050f">
<link rel="icon" href="../icon.png">
<link rel="preload" as="font" type="font/woff2" href="../fonts/kalam-700-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="../fonts/montserrat-latin.woff2" crossorigin>
<link rel="preload" as="image" href="../poster.jpg">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../poster.css">
</head>
<body>
<main>
  <div class="art" role="img" aria-label="A girl in a red coat stands alone in the light of one window of a dark building at night"></div>
  <section class="pitch">
    <h1>Emily's<br>Only Friend</h1>
    <p class="logline">She's trapped, with only one way out: a voice she comes to doubt.</p>
    <div class="gift">
      <img src="../gift-icon.png" alt="A gift wrapped in dark blue star paper, warm light glowing from under its lid">
      <p><strong>A gift is waiting for you inside.</strong>Pre-register now and it's yours the day the game comes out.</p>
    </div>
    <a class="badge" id="play" data-play href="https://play.google.com/store/apps/details?id=com.onepunchapp.girlpuzzle">
      <img src="../badge-preregister.png" alt="Pre-register on Google Play">
    </a>
    <p class="android-only" id="android-only">For Android</p>
    <p class="escape" id="escape">Not opening? <a id="chrome" href="#">Open in Chrome</a></p>
  </section>
</main>
<script src="../bridge.js" data-tap-anywhere></script>
</body>
</html>
